# Disable udev-based input device detection (no udev in this VM).
# Without this, Xorg has zero input devices.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

# QEMU USB tablet — provides absolute cursor positioning.
# Uses evdev driver (not libinput) because libinput requires udev.
Section "InputDevice"
    Identifier "QEMUTablet"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

# Keyboard
Section "InputDevice"
    Identifier "Keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "XkbLayout" "us"
EndSection

Section "ServerLayout"
    Identifier "Layout"
    Screen "Screen0"
    InputDevice "QEMUTablet" "CorePointer"
    InputDevice "Keyboard" "CoreKeyboard"
EndSection
